<style>
:root{
  --cherry:#7d0f22; --cherry2:#a3162f; --cherrydk:#4a0813;
  --frame:#6a0c1d; --paper:#fffaf2; --paper2:#f6ecdb; --line:#e8dac0; --bg:#f6efe1;
  --ink:#2c1a16; --ink2:#5a443c; --mute:#8b7466; --brown:#7d0f22; --gold:#b8923a; --gold2:#d4ad55;
  --kim:#7d8794; --moc:#3c8a4c; --hoa:#e0661c; --tho:#a8742a; --thuy:#2d5d97;
  --good:#3c8a4c; --bad:#b0451c; --warn:#b8923a;
  --serif:'Noto Serif',Georgia,'Times New Roman',serif; --sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --hand:'Dancing Script','Segoe Script','Brush Script MT',cursive;
  --r:16px; --sh:0 6px 22px rgba(90,15,30,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);background-image:radial-gradient(circle at 0 0,#fff7e6 0,transparent 55%),radial-gradient(circle at 100% 100%,#f0e2c6 0,transparent 50%);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.6;min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:600px;margin:0 auto;padding:0 14px calc(90px + env(safe-area-inset-bottom))}
/* header */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#7d0f22,#5e0a19);box-shadow:0 2px 12px rgba(74,8,19,.35);border-bottom:2px solid var(--gold)}
.top-in{max-width:600px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:12px;flex:0 0 42px;display:grid;place-items:center;background:#fffaf0;box-shadow:0 0 0 2px var(--gold2)}
.logo .sealimg{width:34px;height:34px;color:#a3162f}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-family:var(--serif);font-size:18.5px;color:#fff6e4;letter-spacing:.3px;line-height:1.2}
.brand small{color:var(--gold2);font-family:var(--hand);font-size:17px;letter-spacing:.5px;line-height:1}
.brand small em{font-family:var(--sans);font-style:normal;font-size:10px;color:#e9c9cd;letter-spacing:1px;margin-left:6px}
.icon-btn{border:1px solid rgba(255,240,210,.5);background:transparent;color:#fff1d8;border-radius:12px;padding:7px 11px;font-size:13px;font-weight:600}

.h2{font-family:var(--serif);color:var(--brown);font-size:22px;margin:0 0 4px;line-height:1.3}
.h3{font-family:var(--serif);color:var(--brown);font-size:17.5px;margin:18px 0 8px;line-height:1.35}
.rule{height:2px;background:linear-gradient(90deg,var(--brown),transparent);margin:10px 0 14px;border:0}
.sub{color:var(--mute);font-size:13.5px;margin:0}
.gold{color:var(--gold)}
/* mode toggle */
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;margin:14px 0 0;box-shadow:0 2px 8px rgba(90,15,30,.06)}
.seg button{flex:1;border:0;background:transparent;color:var(--ink2);padding:9px 6px;border-radius:10px;font-size:14px;font-weight:600}
.seg button.on{background:var(--cherry);color:#fff6e4}
.dock{display:none;align-items:center;gap:10px;background:#fff;border:1px dashed var(--gold);border-radius:14px;padding:8px;margin-top:12px;color:var(--ink2);font-size:13px}
.dock.show{display:flex}
.dock img{width:54px;height:54px;object-fit:cover;border-radius:10px;border:2px solid var(--gold)}
.dock .x{margin-left:auto;background:transparent;border:0;color:var(--mute);font-size:20px}
.steps{display:flex;gap:4px;margin:14px 0 4px}
.steps i{flex:1;height:5px;border-radius:3px;background:#e6d8bf}
.steps i.done{background:var(--gold)}
.steps i.cur{background:var(--cherry2);box-shadow:0 0 8px rgba(163,22,47,.5)}
.stepmeta{display:flex;justify-content:space-between;color:var(--mute);font-size:12.5px}
/* fields */
.field{padding:14px 0;border-top:1px solid var(--line)}
.field:first-child{border-top:0;padding-top:4px}
.flabel{font-weight:700;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:6px}
.flabel .el{font-size:10.5px;font-weight:700;color:#fff;padding:1px 7px;border-radius:20px}
.fhint{font-size:12.8px;color:var(--mute);margin:2px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--ink2);border-radius:22px;padding:7px 13px;font-size:14px;line-height:1.3;transition:all .15s;text-align:left}
.chip.on{background:var(--brown);border-color:var(--brown);color:#fff8ea;box-shadow:0 3px 10px rgba(125,15,34,.3)}
.chip.multi.on{background:var(--gold);border-color:var(--gold);box-shadow:0 3px 10px rgba(184,146,58,.35)}
.meaning{margin-top:8px;font-size:13.2px;color:var(--ink2);background:var(--paper2);border-left:3px solid var(--gold);padding:7px 10px;border-radius:0 8px 8px 0;display:none}
.meaning.show{display:block}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.upload{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:14px;padding:16px;color:var(--mute);font-size:14px;background:#fff}
.upload.has{padding:8px}
.upload img{max-width:100%;max-height:260px;border-radius:10px}
.note{font-size:13px;color:var(--ink2);background:#fff6e2;border:1px solid #efd9a8;border-radius:12px;padding:10px 12px;margin-top:10px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,250,242,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.nav-in{max-width:600px;margin:0 auto;display:flex;gap:10px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-size:15.5px;font-weight:700}
.btn-gold{background:linear-gradient(180deg,var(--cherry2),var(--cherry));color:#fff6e4;flex:1;box-shadow:0 4px 12px rgba(125,15,34,.3)}
.btn-ghost{background:transparent;color:var(--cherry);border:1.5px solid var(--cherry)}
.btn-light{background:#fff;color:var(--cherry);border:1px solid var(--line)}
.btn:disabled{opacity:.45}
/* accordion */
.acc-h{display:flex;align-items:center;gap:10px;padding:15px 16px;cursor:pointer;user-select:none}
.acc-h .t{flex:1;font-family:var(--serif);font-weight:700;color:var(--brown);font-size:16.5px;line-height:1.3}
.acc-h .t small{display:block;font-family:var(--sans);font-weight:400;font-size:12.5px;color:var(--mute)}
.badge{font-size:12px;background:var(--paper2);color:var(--brown);border-radius:20px;padding:2px 9px;font-weight:700;white-space:nowrap}
.badge.full{background:var(--brown);color:#fff}
.chev{transition:transform .2s;color:var(--gold)}
.acc.open .chev{transform:rotate(180deg)}
.acc-b{display:none;padding:0 16px 16px}
.acc.open .acc-b{display:block}
/* results */
.hero{background:radial-gradient(circle at 50% 0,#9b1730 0,#6a0c1d 60%,#4a0813 100%);text-align:center;padding:20px 16px 16px;position:relative;color:#fff3dc;border-bottom:3px solid var(--gold)}
.hero:before{content:"";position:absolute;inset:7px;border:1px solid rgba(212,173,85,.5);border-radius:12px;pointer-events:none}
.hero .who{font-size:12.5px;color:#e9c9cd;letter-spacing:.5px}
.hero .name{font-family:var(--serif);font-size:25px;color:#fff;margin:2px 0 8px;font-weight:700}
.hero .hb{display:inline-flex;align-items:center;gap:10px;background:rgba(255,250,240,.1);border:1px solid rgba(212,173,85,.55);border-radius:40px;padding:5px 16px 5px 6px;margin:2px 0 8px}
.hero .hb b{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--serif);font-size:14.5px;letter-spacing:0;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.hero .hb span{font-family:var(--serif);font-size:13px;letter-spacing:1.5px;color:var(--gold2);font-weight:700}
.hero .tag{font-family:var(--serif);font-style:italic;color:#ffe9c4;font-size:15.5px;margin:4px 6px 10px}
.hero .mini{color:#e9c9cd}
.ovr{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.ovr .chip{font-size:13px;padding:5px 11px;background:rgba(255,250,240,.1);border-color:rgba(255,230,190,.45);color:#fff1d8}
.hero .note{background:rgba(255,250,240,.12);border-color:rgba(255,230,190,.4);color:#ffe9c4}
.hero .wm{position:absolute;right:-18px;bottom:-18px;width:130px;height:130px;color:#fff;opacity:.07;pointer-events:none}
.lead{font-family:var(--serif);font-size:16.5px;line-height:1.75;color:var(--ink)}
.lead p{margin:0 0 12px}
.lead p:first-letter{}
.p{margin:0 0 10px}
.k{font-weight:700;color:var(--brown)}
.mini{font-size:13px;color:var(--mute)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.charts figure{margin:0;text-align:center}
.charts figcaption{font-size:12.5px;color:var(--mute);font-weight:600;margin-top:-4px}
.charts svg{width:100%;height:auto}
.tri{display:grid;grid-template-columns:1fr;gap:10px}
.tri .col{border-radius:12px;padding:12px;background:#fff;border:1px solid var(--line)}
.tri .col h4{margin:0 0 6px;font-size:13px;letter-spacing:1.5px;color:var(--gold);display:flex;align-items:center;gap:6px}
.it{display:flex;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.it:first-of-type{border-top:0}
.it .m{flex:0 0 20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:2px}
.it.y .m{background:var(--brown);color:#fff}
.it.n .m{background:var(--paper2);color:#c9b89c}
.it.n .tt{color:#a7957d}
.it .tt b{display:block;font-weight:600}
.it .tt em{font-style:normal;font-size:13px;color:var(--ink2)}
.meter{margin:6px 0 2px}
.meter .lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink2)}
.bar{height:9px;border-radius:6px;background:var(--paper2);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:6px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:2px 9px;margin:0 4px 4px 0}
.pill.g{background:#e3f1e2;color:var(--good)}.pill.b{background:#f9e3d6;color:var(--bad)}.pill.w{background:#f7ecd0;color:#7e5f12}.pill.n{background:var(--paper2);color:var(--ink2)}
.organ{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 13px;margin:10px 0}
.organ h4{margin:0 0 6px;font-family:var(--serif);color:var(--brown);font-size:16px;display:flex;align-items:center;gap:8px}
.organ h4 .el{font-family:var(--sans);font-size:10.5px;color:#fff;padding:1px 7px;border-radius:20px}
.organ ul{margin:4px 0 0;padding-left:18px}
.organ li{margin:3px 0}
.quote{font-family:var(--serif);font-style:italic;color:var(--brown);border-left:3px solid var(--gold);padding:4px 0 4px 12px;margin:10px 0}
.lt{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.lt:first-child{border-top:0}
.lt .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--serif);flex:0 0 38px}
.lt .bd{flex:1;min-width:0}
.lt .bd b{font-size:14.5px}
.lt .bd div{font-size:12.5px;color:var(--mute)}
.lt .sc{font-weight:700;font-size:15px;min-width:40px;text-align:right}
.asp{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:4px 0 12px}
.asp button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;font-size:13px;font-weight:600;color:var(--ink2);line-height:1.25}
.asp button .ic{display:block;font-size:19px;margin-bottom:2px}
.asp button.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px;background:var(--paper2);border-radius:12px;padding:9px 10px;margin:4px 0 10px}
.path .ar{color:var(--gold)}
.conf{border-radius:14px;border:1px solid var(--line);background:#fff;margin:10px 0;overflow:hidden}
.conf .ch{padding:10px 12px;font-weight:700;color:#fff;background:var(--brown);font-size:14.5px}
.conf .cb{padding:10px 12px;font-size:14.3px}
.conf .cb div{margin:4px 0}
.conf .lb{font-size:11.5px;font-weight:700;letter-spacing:1px;color:var(--gold);text-transform:uppercase;display:block}
.warnbox{background:#fdf1e8;border:1px solid #f0cdb3;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.goodbox{background:#eef6ec;border:1px solid #cfe5cb;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.closing{text-align:center;font-family:var(--serif);color:var(--brown)}
.closing .three{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.res-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
/* sheet & toast */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(40,5,12,.6);display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheet-in{background:var(--paper);width:100%;max-width:600px;border-radius:20px 20px 0 0;max-height:82vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet-in.img{background:transparent;text-align:center;padding:14px}
.sheet-in.img img{max-width:100%;max-height:78vh;border-radius:12px}
.rec{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.rec .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--serif)}
.rec .bd{flex:1}
.rec .bd b{display:block}
.rec .bd span{font-size:12.5px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--cherrydk);color:#fff1d8;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:all .25s;z-index:80;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.el{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;padding:1px 8px;border-radius:20px;font-family:var(--sans);vertical-align:middle;line-height:1.6}
.chips.pics .chip.pic{flex:0 0 calc(33.33% - 5px);display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px 8px;border-radius:14px;text-align:center;font-size:12.5px;line-height:1.25}
.chip.pic svg{width:100%;max-width:64px;height:44px;color:var(--brown)}
.chip.pic.on svg{color:#fff8ea}
.chip.multi.pic.on svg{color:#fff}
.inten{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:12.5px;color:var(--mute)}
.inten span{margin-right:2px}
.inten button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:4px 10px;font-size:12.5px;color:var(--ink2);font-weight:600}
.inten button.on.n1{background:#e9e2d4;border-color:#d8ccb5}
.inten button.on.n2{background:var(--brown);border-color:var(--brown);color:#fff}
.inten button.on.n3{background:var(--bad);border-color:var(--bad);color:#fff}
.axis{border:1.5px solid var(--gold);background:linear-gradient(180deg,#fffaf0,#fff);border-radius:14px;padding:12px 13px}
.ax-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--serif);font-size:17px;color:var(--brown);margin-bottom:6px}
.ax-h .lb{font-family:var(--sans)}
.lb{font-size:11.5px;font-weight:700;letter-spacing:1px;color:var(--gold);text-transform:uppercase;display:block}
.ax-row{display:flex;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:14.5px}
.ax-n{flex:0 0 22px;height:22px;border-radius:50%;background:var(--brown);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.ask{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 12px;margin:9px 0}
.ask-q{display:flex;gap:9px;font-weight:600;font-size:14.5px}
.ask-b{display:flex;gap:7px;margin:9px 0 0 31px}
.ask-b button{flex:1;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 4px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.ask-b button.on.y{background:var(--good);border-color:var(--good);color:#fff}
.ask-b button.on.p{background:var(--gold);border-color:var(--gold);color:#fff}
.ask-b button.on.n{background:var(--bad);border-color:var(--bad);color:#fff}
.ask-r{margin:9px 0 0 31px;font-size:13.8px;padding:8px 10px;border-radius:10px;background:var(--paper2)}
.ask-r.y{background:#eef6ec}.ask-r.n{background:#fdf1e8}.ask-r.p{background:#fbf3df}
.role{margin-top:8px;font-size:13.6px;background:var(--paper2);border-radius:10px;padding:8px 10px;color:var(--ink2)}
.van{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.van-c{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 8px;text-align:center}
.van-t{font-family:var(--serif);font-weight:700;color:var(--brown);font-size:15px}
.van-s{font-size:11px;color:var(--mute);line-height:1.3;min-height:28px}
.van-v{font-size:22px;font-weight:700;margin:2px 0}
details.more{margin:8px 0}
details.more summary{cursor:pointer;color:var(--brown);font-weight:600;font-size:14px;padding:6px 0}
.hide{display:none!important}
.fade{animation:fd .35s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (min-width:520px){.tri{grid-template-columns:1fr 1fr 1fr}.tri .it{font-size:13.5px}}

/* v3 */
.chipnav{position:sticky;top:64px;z-index:20;margin:0 -14px;padding:8px 14px;background:rgba(246,239,225,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.chipnav::-webkit-scrollbar{display:none}
.chipnav a{flex:0 0 auto;font-size:12.5px;font-weight:600;color:var(--cherry);background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 12px;text-decoration:none;white-space:nowrap}
.chipnav a.on{background:var(--cherry);color:#fff6e4;border-color:var(--cherry)}
.sec-t{font-family:var(--serif);color:var(--cherry);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin:20px 4px 2px;display:flex;align-items:center;gap:8px}
.sec-t:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.skcard{padding:14px 12px 16px}
.skcard h2{margin:0 0 2px;text-align:center}
.sk-wrap{display:grid;gap:12px}
.sk{width:100%;max-width:340px;height:auto;margin:6px auto 0;display:block}
.sk-leg{list-style:none;margin:0;padding:0}
.sk-leg li{display:flex;gap:9px;font-size:13.4px;padding:5px 0;border-top:1px dashed var(--line);line-height:1.45}
.sk-leg li:first-child{border-top:0}
.sk-n{flex:0 0 20px;height:20px;border-radius:50%;background:var(--cherry);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.mini2{font-size:12.8px;color:var(--ink2)}
.pchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 10px}
.pchip{--c:var(--cherry);display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--c);background:#fff;border:1.5px solid var(--c);border-radius:20px;padding:3px 11px}
.pchip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.pcols{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:8px}
.pcols ul{list-style:none;margin:0;padding:0}
.pcols li{display:flex;gap:8px;font-size:13.6px;padding:4px 0;line-height:1.45}
.pcols li .m{flex:0 0 18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:2px}
.pcols li.g .m{background:#e3f1e2;color:var(--good)}.pcols li.b .m{background:#f9e3d6;color:var(--bad)}.pcols li.n{color:var(--mute)}
.plb{font-size:11.5px;font-weight:700;letter-spacing:1.2px;color:var(--cherry);text-transform:uppercase;border-bottom:1px solid var(--line);margin-bottom:4px;padding-bottom:2px}
.psum{font-family:var(--serif);font-size:15px;line-height:1.7;background:var(--paper2);border-left:3px solid var(--cherry);border-radius:0 12px 12px 0;padding:10px 12px}
.sk-btn{display:block;width:100%;margin-top:12px}
.sig{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0 4px}
.sig-t{text-align:center;line-height:1.1}
.sig-t .s1{font-family:var(--hand);font-weight:700;font-size:44px;color:var(--cherry);letter-spacing:1px;transform:rotate(-3deg)}
.sig-t .s2{font-family:var(--hand);font-size:16.5px;color:var(--ink2);margin-top:-2px}
.sig-t .s3{font-size:10.5px;color:var(--mute);margin-top:4px;letter-spacing:.5px}
.sig .stamp{width:78px;height:78px;color:#b3122d;opacity:.92;transform:rotate(-6deg);mix-blend-mode:multiply}
.closing{border-top:3px solid var(--cherry)}
@media (min-width:520px){.pcols{grid-template-columns:1fr 1fr}.sk-wrap{grid-template-columns:340px 1fr;align-items:start}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo"><i class="sealimg"></i></div>
  <div class="brand"><h1>Diện Tướng Học</h1><small>TIEN.TQN<em>HIỆU DƯƠNG MINH</em></small></div>
  <button class="icon-btn" id="btn-records">Hồ sơ</button>
</div></header>

<div class="wrap">
  <div id="chipnav" class="chipnav hide"></div>
  <section id="scr-input">
    <div class="seg" id="mode-seg"><button data-m="wizard" class="on">Từng bước</button><button data-m="form">Toàn bộ</button></div>
    <div class="dock" id="dock"><img id="dock-img" alt="ảnh"><div>Ảnh đối chiếu<br><span style="opacity:.7">Chạm để phóng to</span></div><button class="x" id="dock-x" aria-label="Bỏ ảnh">×</button></div>
    <div id="wiz"></div>
    <div id="formv" class="hide"></div>
  </section>
  <section id="scr-result" class="hide"></section>
</div>

/* helpers */
function is(d,k,v){return d[k]===v}
function has(d,k,v){return Array.isArray(d[k])&&d[k].includes(v)}
function any(d,k){return d[k]!==undefined&&d[k]!==null&&!(Array.isArray(d[k])&&!d[k].length)}
function optMeaning(k,v){const f=F[k];if(!f)return'';const o=f.o.find(x=>x[0]===v);return o?o[2]:''}
function optLabel(k,v){const f=F[k];if(!f)return v;const o=f.o.find(x=>x[0]===v);return o?o[1]:v}

/* =================== BỘ MÁY PHÂN TÍCH =================== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=v=>Math.round(v);
function band(s){ if(s==null) return 'na'; if(s>=72) return 'vuong'; if(s>=56) return 'kha'; if(s>=43) return 'tb'; return 'suy'; }
const BANDTXT={vuong:'Vượng',kha:'Khá',tb:'Trung bình',suy:'Suy',na:'Chưa đủ dữ liệu'};
const BANDCOL={vuong:'#3c8a4c',kha:'#7a9a35',tb:'#c48a12',suy:'#b0451c',na:'#a7957d'};

/* ---- Mức độ nét: 1 nhẹ · 2 rõ · 3 thái quá ---- */
function lv(d,k){return (d._m&&d._m[k])||2}
function W(d,k,s){const l=lv(d,k); if(l===2) return 1; if(l===1) return .6; return s>=0?.85:1.4;}
function WI(d,k){return [0,.6,1,1.3][lv(d,k)]}

/* ---- 1. Định diện tướng ---- */
function inferTuong(d){
  const s={kim:0,moc:0,hoa:0,tho:0};
  const a=(h,v)=>{s[h]+=v};
  if(d.mat_dang&&d.mat_dang!=='thuy') a(d.mat_dang,4);
  if(is(d,'mat_size','nho')){a('kim',.7*WI(d,'mat_size'));a('tho',.5*WI(d,'mat_size'))}
  if(has(d,'mat_sac','sac')) a('kim',1);
  if(is(d,'lm_dam','dam')){a('kim',.7*WI(d,'lm_dam'));a('tho',.7*WI(d,'lm_dam'))}
  if(is(d,'mui_xuong','lo')){a('kim',1*WI(d,'mui_xuong'));a('tho',.7*WI(d,'mui_xuong'))}
  if(is(d,'gm','lo')){a('kim',.8*WI(d,'gm'));a('tho',1*WI(d,'gm'))}
  if(is(d,'tai_xuong','lo')) a('kim',.8*WI(d,'tai_xuong'));
  if(is(d,'tai_hinh','lon')){a('kim',.5*WI(d,'tai_hinh'));a('tho',.5*WI(d,'tai_hinh'))}
  if(is(d,'cam_hinh','nho')){a('kim',.8*WI(d,'cam_hinh'));a('tho',.5*WI(d,'cam_hinh'))}
  if(is(d,'cam_hinh','banh')) a('tho',1*WI(d,'cam_hinh'));
  if(is(d,'cot','to')) a('tho',.7*WI(d,'cot'));
  if(is(d,'mat_sau','sau')) a('tho',.8*WI(d,'mat_sau'));
  if(is(d,'mui_cao','thap')) a('moc',.8*WI(d,'mui_cao'));
  if(is(d,'mui_xuong','thit')){a('moc',.7*WI(d,'mui_xuong'));a('hoa',.5*WI(d,'mui_xuong'))}
  if(is(d,'lm_dam','nhat')) a('moc',.8*WI(d,'lm_dam'));
  if(is(d,'lm_matdo','thua')) a('moc',.5*WI(d,'lm_matdo'));
  if(is(d,'tai_day','day')) a('moc',.8*WI(d,'tai_day'));
  if(is(d,'moi_tren','mong')) a('moc',.4*WI(d,'moi_tren'));
  if(has(d,'mat_sac','uot')) a('moc',.4);
  if(is(d,'bau_ma','thit')) a('hoa',1*WI(d,'bau_ma'));
  if(is(d,'mieng_net','tuoi')) a('hoa',.8*WI(d,'mieng_net'));
  if(is(d,'mieng_rong','rong')) a('hoa',.7*WI(d,'mieng_rong'));
  if(is(d,'mieng_cuoi','holoi')) a('hoa',.5*WI(d,'mieng_cuoi'));
  if(is(d,'mat_size','to')) a('hoa',.7*WI(d,'mat_size'));
  if(is(d,'mat_sau','loi')) a('hoa',.7*WI(d,'mat_sau'));
  if(is(d,'mui_dau','hech')) a('hoa',.8*WI(d,'mui_dau'));
  if(is(d,'tran_hinh','do')) a('hoa',.7*WI(d,'tran_hinh'));
  if(is(d,'tai_hinh','vanh')) a('hoa',.7*WI(d,'tai_hinh'));
  if(is(d,'mui_canh','to')) a('hoa',.5*WI(d,'mui_canh'));
  if(is(d,'gm','thit')) a('hoa',.6*WI(d,'gm'));
  const rank=Object.keys(s).sort((x,y)=>s[y]-s[x]);
  const top=s[rank[0]], sec=s[rank[1]];
  let thuy=0;
  if(d.mat_dang==='thuy') thuy=4+(top>0?sec/top*2:0);
  else if(top>0) thuy=Math.max(0,(sec/top)*2.2-0.6);
  const all={...s,thuy};
  let main=rank[0];
  if(d.mat_dang==='thuy' || (!d.mat_dang && top>0 && top-sec<0.6)) main='thuy';
  const max=Math.max(...Object.values(all),0.01);
  const pct={}; for(const k in all) pct[k]=rnd(all[k]/max*100);
  return {main, rank, comps:[rank[0],rank[1]], second: main==='thuy'?rank[0]:rank[1], raw:all, pct, empty: top===0 && d.mat_dang!=='thuy'};
}

/* ---- 2. Chất lượng bộ vị (dùng cho Lục thân) ---- */
function mk(d){const o={raw:0,n:0,items:[],d};o.add=(c,s,t,y,k)=>{if(c){const l=k?lv(d,k):2;if(k)s=s*W(d,k,s);o.raw+=s;o.items.push({s,t:t+(l===3?' (thái quá)':(l===1?' (nhẹ)':'')),y,k,l})}};return o}
function finish(o,keys,d){
  o.n=keys.filter(k=>any(d,k)).length;
  o.score=o.n?clamp(rnd(52+o.raw*7.5),6,97):null;
  o.good=o.items.filter(i=>i.s>0); o.bad=o.items.filter(i=>i.s<0); o.neu=o.items.filter(i=>i.s===0);
  o.band=band(o.score); return o;
}

/* ---- 4. Phúc ---- */
function calcPhuc(d,ctx){
  const f=(arr)=>{const a=arr.filter(x=>x[0]!==null);if(!a.length)return null;return a.reduce((s,x)=>s+x[0]*x[1],0)/a.reduce((s,x)=>s+x[1],0)};
  const v=(k,good,bad)=>!any(d,k)?null:(is(d,k,good)?1:(bad&&is(d,k,bad)?0:0.5));
  const than=f([[v('mui_soncan','cao','thap'),2],[v('mui_xuong','vung'),1],[any(d,'mui_db')?(d.mui_db.some(x=>['gay','vetngang','lech'].includes(x))?0:1):null,1]]);
  const tam=f([[v('tai_day','day','mong'),2],[v('tai_size','to','nho'),1],[v('tai_dai','to','nho'),1]]);
  const tranP=f([[v('tran_cao','cao'),1],[v('tran_phang','phang','khong'),1],[v('tran_rong','rong','hep'),1]]);
  const matP=f([[v('mat_tinh','tinh','dong'),1],[v('mat_minh','minh','lodo'),1],[v('mat_sau','sau','loi'),1]]);
  let tri=null; if(tranP!==null||matP!==null) tri=(tranP??0.5)*0.3+(matP??0.5)*0.7;
  const p=x=>x===null?null:rnd(x*100);
  const r={than:p(than),tam:p(tam),tri:p(tri),tranP:p(tranP),matP:p(matP)};
  const vals=[r.than,r.tam,r.tri].filter(x=>x!==null);
  r.avg=vals.length?rnd(vals.reduce((a,b)=>a+b,0)/vals.length):null;
  r.loai = r.avg===null?'na': (r.avg>=66&&Math.min(...vals)>=50?'tienthien':(r.avg<40?'batuc':'trung'));
  r.hauthien = is(d,'giong','trungkhi');
  return r;
}

function hinhThan(d,T){
  const r={has:!!d.than_chu};
  if(d.than_chu){
    const th=THAN[d.than_chu]; r.than=th; r.tH=th.h;
    if(th.h===T) r.rel='dong';
    else if(SINH[T]===th.h) r.rel='hinhsinh';
    else if(SINH[th.h]===T) r.rel='thansinh';
    else r.rel='batphoi';
  }
  r.xung=(is(d,'cot','to')&&is(d,'hanh_xu','mem'))||(is(d,'cot','nho')&&is(d,'hanh_xu','manh'));
  r.xungTxt=is(d,'cot','to')?'xương to mà hành xử mềm mại':'xương nhỏ mà hành xử mạnh mẽ';
  const w=[]; if(is(d,'mui_soncan','thap'))w.push('sơn căn thấp'); if(has(d,'mui_db','lech'))w.push('mũi lệch'); if(has(d,'mieng_db','ho'))w.push('miệng hở'); if(is(d,'moi_tren','day')||is(d,'moi_duoi','to'))w.push('môi dày');
  r.canh=(r.rel==='batphoi'||r.xung)&&w.length>=2?w:[];
  return r;
}

  const sig=[];

  if(T==='moc'){ if(is(d,'than_thai','lanh')||has(d,'mat_sac','lanh')) sig.push('lạnh nhạt'); if(is(d,'moi_mau','xam')) sig.push('môi xám nhợt'); if(is(d,'than_chu','tang')||is(d,'than_chu','tinhk')) sig.push('thần '+THAN[d.than_chu].ten.toLowerCase()); }
  if(T==='hoa'){ const a=is(d,'than_chu','tinhk')||is(d,'than_chu','tinht'), b=is(d,'mieng_cuoi','kin'), c=is(d,'mat_size','nho');

  if(T==='tho'){ if(is(d,'than_chu','tinht')||is(d,'than_chu','hoa')) sig.push('thần '+THAN[d.than_chu].ten.toLowerCase()); if(is(d,'tai_day','mong')) sig.push('tai mỏng'); if(is(d,'than_thai','lodo')||is(d,'mat_minh','lodo')||has(d,'mat_db','loquang')) sig.push('ánh mắt vô hồn / mất thần'); }

  out.sort((a,b)=>b.w-a.w);

}

/* ---- 8. Tổng hợp ---- */
function analyze(S){
  const d=S.d, gt=S.info.gt, tuoi=+S.info.tuoi||null, ctx={gt,tuoi};
  const inf=inferTuong(d);
  const T=S.override||inf.main;
  const comps = T==='thuy' ? inf.comps : [T];
  const Q={hoa:qMat(d,ctx), thuy:qTai(d), kim:qMieng(d,ctx), tho:qTho(d), moc:qMoc(d)};
  const R={d,gt,tuoi,ten:S.info.ten,inf,T,comps,Q};
  R.second = T==='thuy'? null : (inf.rank.find(x=>x!==T));
  R.secondPct = R.second? inf.pct[R.second]:0;
  R.gxbList = (T==='thuy'?[]:comps).map(h=>({h,
    gt:GXB[h].gt.map(x=>({t:x[0],y:!!x[1](d),mean:x[2]})),
    xd:GXB[h].xd.map(x=>({t:x[0],y:!!x[1](d),mean:x[2],kho:x[3],giai:x[4]})),
    bk:GXB[h].bk.map(x=>({t:x[0],y:!!x[1](d),mean:x[2]}))}));
  R.gxbSum = R.gxbList.reduce((s,G)=>({gt:s.gt+G.gt.filter(x=>x.y).length,xd:s.xd+G.xd.filter(x=>x.y).length,bk:s.bk+G.bk.filter(x=>x.y).length,gtN:s.gtN+G.gt.length,xdN:s.xdN+G.xd.length,bkN:s.bkN+G.bk.length}),{gt:0,xd:0,bk:0,gtN:0,xdN:0,bkN:0});
  R.lt=lucThan(T,gt,Q);
  R.nghiLuc=Q.tho.score;
  R.phuc=calcPhuc(d,ctx);
  R.ht=hinhThan(d,T);
  R.phan=T==='thuy'?{sig:[],level:'khong'}:phanTuong(d,T);
  R.nhom=nhomTinhCach(d,T,comps,R.nghiLuc);
  R.tai=tuongTai(d,R.ht);
  R.cam=camCheck(d);
  R.conf=findConflicts(d,R);
  R.khoHopTac = gt==='nam' ? [is(d,'mui_cao','thap')&&'mũi quá tẹt', is(d,'lm_giao','co')&&'lông mày giao nhau mạnh', is(d,'cam_hinh','banh')&&is(d,'cam_xuong','lo')&&'cằm quá bạnh', is(d,'lm_matdo','ram')&&is(d,'lm_dam','dam')&&'lông mày quá rậm'].filter(Boolean) : [];
  const isMoc = T==='moc'||comps.includes('moc');
  R.vayMuon = isMoc && [is(d,'rang_tren','thua')||is(d,'rang_duoi','thua'), is(d,'mieng_cuoi','holoi'), is(d,'mat_size','to')].filter(Boolean).length>=2;
  R.hoaDuc = (T==='hoa'||comps.includes('hoa'))&&is(d,'gm','thit');
  R.filled = Object.keys(F).filter(k=>any(d,k)).length;
  R.ans = S.ans||{};
  R.themes = computeThemes(R);
  R.van = vanTrinh(R);
  return R;
}

function luanTran(d,R){

  const cao=is(d,'tran_cao','cao'), rong=is(d,'tran_rong','rong');
  if(cao&&rong) L.push('<b>Vừa cao vừa rộng</b> — óc suy tưởng (trừu tượng, sáng tạo) và óc thực tế (logic) cùng có mặt: nghĩ được điều lớn, mà cũng biết đặt nó xuống đất.');
  else if(cao) L.push('<b>Trán cao</b> — trí lực thiên về trừu tượng, tưởng tượng, sáng tạo: giỏi nhìn ra ý niệm, hình mẫu, tương lai.');
  else if(rong) L.push('<b>Trán rộng</b> — trí lực thiên về logic, thực tế: giỏi phân tích, hệ thống, tính toán.');
  if(is(d,'tran_rong','hep')) L.push('<b>Trán hẹp</b> — tầm tư duy bị thu lại; dễ thấy đúng trong phạm vi nhỏ mà thiếu tầm nhìn lớn.');
  if(is(d,'tran_phang','phang')) L.push('<b>Mặt trán phẳng, đầy</b> — trí lực được nâng đỡ, ít trở ngại trong học hỏi.');
  if(is(d,'tran_toc','xam')) L.push('<b>Tóc xâm phạm trán</b> — nét xung đột với Kim, Thổ: trí lực bị che, dễ cố chấp.');
  if(is(d,'an_duong','sang')) L.push('<b>Ấn đường sáng</b> — sức khỏe tinh thần tốt, đầu óc thông thoáng.');
  if(is(d,'an_duong','toi')) L.push('<b>Ấn đường tối, hẹp</b> — sức khỏe tinh thần đang hao: dễ căng thẳng, lo nghĩ.');

  return L;
}

function luanMat(d,R){

  const tinh=is(d,'mat_tinh','tinh'), minh=is(d,'mat_minh','minh'), sau2=sau==='sau';

  if(R.ht.has){
    const m={dong:'thần cùng hành với hình — ổn định, nhưng thành thì cực thành, bại thì cực bại',hinhsinh:'hình sinh thần — dễ được lợi từ môi trường, gặp quý nhân',thansinh:'thần sinh hình — dễ ôm đồm, hao hụt nội lực',batphoi:'hình thần bất tương phối — tâm xung mệnh'};
    P.push(`Thần <b>${R.ht.than.ten}</b> (${HANH[R.ht.tH]}) đặt trên hình ${HANH[T]}: ${m[R.ht.rel]}.${R.ht.xung?` Thêm nữa, ${R.ht.xungTxt} — hình thần xung nhau.`:''}`);
  }
  const lts=LT_ORDER.map(k=>({k,...R.lt[k]})).filter(x=>x.score!=null).sort((a,b)=>b.score-a.score);
  if(lts.length>=2){
    const hi=lts[0], lo=lts[lts.length-1];
    if(hi.score-lo.score>=8) P.push(`Trong Lục thân, cung mạnh nhất là <b>${hi.ten}</b> (${lc(hi.y)} — xem ở ${hi.bovi.toLowerCase()}), cung yếu nhất là <b>${lo.ten}</b> (${lc(lo.y)} — xem ở ${lo.bovi.toLowerCase()}). Đời người này được nâng bởi ${lc(hi.y.split(/[,·]/)[0])}, và phải học nhiều nhất ở ${lc(lo.y.split(/[,·]/)[0])}.`);
  }
  let s5=`Cái khổ gốc của tướng ${HANH[T]}: ${lc(t.khoGoc)}`;
  if(R.themes.length){ const a=R.themes[0], th=THEMES[a.t]; s5+=` Nhưng sợi chỉ đỏ xuyên suốt khuôn mặt này là <b>${lc(th.ten)}</b>: ${lc(th.goc)}${a.ev.length?` (${a.ev.slice(0,4).map(e=>e.t).join(', ')})`:''}. ${th.kho}`; if(R.themes[1]) s5+=` Bên cạnh đó là trục phụ <b>${lc(THEMES[R.themes[1].t].ten)}</b>.`; }
  P.push(s5);
  const af=leadFromAnswers(R); if(af) P.push(af);
  P.push(`Lời dạy cho tướng này: <b>Nhất tâm</b> — hiểu rõ tâm mình và đặt mình vào đúng môi trường. ${t.mt} Khi không thay đổi được hiện thực, hãy thay đổi thái độ với hiện thực; tướng không cố định, nó đổi theo cách mình sống.`);
  return P;
}

/* ---------- Phúc ---------- */
function luanPhuc(R){
  const p=R.phuc, out=[];
  if(p.loai==='tienthien'){
    out.push('<b>Phúc tiên thiên dày.</b> Thân (mũi), tâm (tai), trí (trán – mắt) đều có nền. Trước 35 tuổi vận khí thường tốt.');
    out.push('Nhưng phúc tiên thiên là con dao hai lưỡi: dễ sinh kiêu mạn, xa hoa, phóng dục mà tổn phúc. Quãng <b>34–38 tuổi</b> là lúc dễ đổ gục nếu không tự kiểm soát; chỉ 20–30% giữ được — và họ là nhóm tinh hoa.');
    if(R.tuoi&&R.tuoi>=33&&R.tuoi<=38) out.push(`<span class="k">Ở tuổi ${R.tuoi}, ${R.gt==='nu'?'chị':'anh'} đang đứng đúng quãng thử thách này — giữ mình là giữ phúc.</span>`);
  } else if(p.loai==='batuc'){
    out.push('<b>Tiên thiên bất túc.</b> Xuất phát điểm về thân – tâm – trí chưa dày.');
    out.push('Lời khuyên của tướng học: tránh kiêu ngạo; giấu tài, ẩn mình, tránh hiển lộ sớm; tránh làm chuyện bao đồng — kẻo hao tổn sinh lực. Phúc của người này nằm ở <b>hậu thiên</b>: đạt được qua nhất tâm, thường sau 35 tuổi.');
  } else if(p.avg!==null){
    const arr=[['thân',p.than],['tâm',p.tam],['trí',p.tri]].filter(x=>x[1]!==null).sort((a,b)=>b[1]-a[1]);
    out.push(`<b>Phúc ở mức trung.</b> Dày nhất là phúc về ${arr[0][0]}, mỏng nhất là phúc về ${arr[arr.length-1][0]}. Phần tiên thiên cho một nền vừa đủ; phần còn lại do hậu thiên — sự nhất tâm sau 35 tuổi — quyết định.`);
  } else out.push('Chưa đủ dữ liệu về mũi, tai, trán, mắt để luận phúc.');
  if(p.hauthien) out.push('<b>Thanh tướng</b>: nói từ trong bụng, giọng đầy trung khí — dấu hiệu phúc hậu thiên đang được bồi đắp.');
  return out;
}
function luanHinhThan(R){
  const h=R.ht, out=[];
  if(!h.has){ out.push('Chưa chọn thần chủ đạo nên chưa xét được quan hệ Hình – Thần.'); }
  else{
    out.push(`Hình <b>${HANH[R.T]}</b> · Thần <b>${h.than.ten}</b> (${HANH[h.tH]}) — ${h.than.y}.`);
    const m={
      dong:'<b>Thần cùng hành với hình</b>: ổn định, thuần nhất. Thành thì cực thành, bại thì cực bại. Cần biết thoái lui khi thành công, tích lũy nguồn lực — đừng dồn hết vào một ván.',
      hinhsinh:'<b>Hình sinh thần</b>: dễ được lợi từ môi trường, gặp quý nhân — năng lượng của hình tự nhiên nuôi cách mình biểu lộ, nên người khác dễ quý, dễ giúp.',
      thansinh:'<b>Thần sinh hình</b>: dễ ôm đồm, hao hụt nội lực — cách biểu lộ phải gồng để nuôi bản tướng; cần học cách từ chối.',
      batphoi:'<b>Hình thần bất tương phối</b>: tâm xung mệnh — cách sống, cách biểu lộ đi ngược với khuôn mình được sinh ra. Khổ, nhưng chính cái khổ ấy tạo nên người xuất chúng nếu biết nhìn thấy nó để điều chỉnh, gỡ rối, chỉnh tâm.'};
    out.push(m[h.rel]);
  }
  if(h.xung) out.push(`<b>Hình thần xung nhau</b>: ${h.xungTxt}.`);
  if(has(R.d,'mat_db','loquang')) out.push('<b>Mắt lộ quang — mất thần</b>: dù thần chủ đạo là gì, thần đang bị tán ra ngoài, khó giữ được. Việc đầu tiên là thu thần về: tĩnh tâm, giảm phô bày, nghỉ ngơi.');
  if(h.canh.length) out.push(`<span style="color:var(--bad)"><b>Cảnh tỉnh</b>: hình thần không thuận lại đi kèm ${joinVi(h.canh)} — tài liệu cảnh báo dễ hao tổn tuổi thọ hoặc bị lừa. Đây là lời nhắc giữ gìn sức khỏe và cẩn trọng với người, không phải lời định sinh tử.</span>`);
  return out;
}

/* ---------- Lục thân ---------- */

 tai:{vuong:'Khả năng kiếm tiền tốt, tài lộc dồi dào — biết nắm và biết giữ cơ hội tài chính.',kha:'Tài lộc khá: có năng lực kiếm tiền, cần kỷ luật để giữ.',tb:'Tài chính lên xuống: kiếm được nhưng hay rò rỉ — cần nguyên tắc chi tiêu rõ ràng.',suy:'Khả năng kiếm tiền chưa thuận: dễ hao tài hoặc kiếm vất vả. Đây là vùng phải dùng chữ "tích lũy" thay vì chữ "đánh nhanh".'},

 phu:{vuong:'Được cha mẹ, bề trên nâng đỡ; dễ gặp quý nhân; xuất phát điểm có nền.',kha:'Có sự hỗ trợ từ cha mẹ, bề trên ở mức khá.',tb:'Sự nâng đỡ từ bề trên không đều; nhiều việc phải tự thân.',suy:'Ít được che chở từ cha mẹ, bề trên; quý nhân đến muộn. Tự lập sớm — và chính điều đó làm nên bản lĩnh.'},
 tu:{vuong:'Con cái, cấp dưới là phúc: dễ có người kế tục, cấp dưới trung thành, quản trị người tốt.',kha:'Quan hệ với con cái, cấp dưới khá tốt.',tb:'Con cái, cấp dưới cần nhiều công dạy dỗ; quan hệ trên – dưới phải chủ động xây.',suy:'Con cái, cấp dưới là nơi hao tâm: dễ vất vả vì người dưới hoặc khó tìm người kế tục. Hãy đầu tư vào việc dạy người.'}

const SPOUSE={vuong:'là người có nền tảng, giỏi giang, phù trợ đắc lực',kha:'là người đảm đang, hợp tác được, hai bên nâng nhau',tb:'cần thời gian để hòa hợp — hai người phải học cách nhìn nhau',suy:'là mối duyên nhiều thử thách — người phối ngẫu có thể vất vả, hoặc hai bên khó đồng điệu; cần kiên nhẫn và tôn trọng'};
function spouseTxt(rel,R){
  const L=R.lt[rel]; if(L.band==='na') return '';
  const who=R.gt==='nam'?'người vợ':'người chồng';
  const feats=L.q.items.filter(i=>i.y).slice(0,5).map(i=>lc(i.y));
  return `<div class="p"><span class="k">Về ${who}:</span> ${who.charAt(0).toUpperCase()+who.slice(1)} ${SPOUSE[L.band]}. Vì bộ vị ${L.bovi.toLowerCase()} cũng là chân dung của ${who}, nên ${who} mang nét: ${feats.length?joinVi(feats):'chưa đủ dữ liệu để phác họa'}.</div>`;
}

/* ---------- Hỏi theo khía cạnh ---------- */
const ASPECTS=[
 {k:'congviec',ic:'💼',t:'Công việc',rel:()=> 'quan'},
 {k:'tienbac',ic:'💰',t:'Tiền bạc',rel:()=> 'tai'},
 {k:'honnhan',ic:'💞',t:'Hôn nhân',rel:R=> R.gt==='nam'?'tai':'quan'},
 {k:'chame',ic:'🏛️',t:'Cha mẹ · Quý nhân',rel:()=> 'phu'},
 {k:'concai',ic:'🌱',t:'Con cái · Cấp dưới',rel:()=> 'tu'},
 {k:'anhem',ic:'🤝',t:'Anh em · Bạn bè',rel:()=> 'huynh'}
];
function relWhy(rel,T){
  const L={huynh:`cùng hành ${HANH[T]} với diện tướng`,tai:`${HANH[T]} khắc ${HANH[KHAC[T]]} — hành bị diện tướng khắc`,quan:`${HANH[khacBoi(T)]} khắc ${HANH[T]} — hành khắc diện tướng`,phu:`${HANH[sinhRa(T)]} sinh ${HANH[T]} — hành sinh cho diện tướng`,tu:`${HANH[T]} sinh ${HANH[SINH[T]]} — hành do diện tướng sinh ra`};
  return L[rel];
}
function aspectHTML(key,R){
  const A=ASPECTS.find(a=>a.k===key); const rel=A.rel(R); const L=R.lt[rel]; const d=R.d, T=R.T;
  let h=`<div class="path"><b>${A.t}</b><span class="ar">→</span>Lục thân <b>${L.ten}</b><span class="ar">→</span>${elTag(L.h)}<span class="ar">→</span><b>${L.bovi}</b></div>`;
  h+=`<p class="mini">Diện tướng ${HANH[T]}: ${relWhy(rel,T)}. Nên muốn xem ${A.t.toLowerCase()}, ta xét bộ vị hành ${HANH[L.h]} — ${BOVI[L.h].ten.toLowerCase()}.</p>`;
  if(L.band==='na'){ h+=`<div class="warnbox">Chưa có đủ đặc điểm của ${L.bovi.toLowerCase()} để luận. Hãy bổ sung ở bước tương ứng.</div>`; }
  else{
    h+=`<div class="meter"><div class="lbl"><span>Độ vượng của bộ vị ${L.ten}</span><span style="color:${BANDCOL[L.band]}">${L.score} · ${BANDTXT[L.band]}</span></div><div class="bar"><i style="width:${L.score}%;background:${BANDCOL[L.band]}"></i></div></div>`;
    if(L.q.good.length) h+=`<div class="p" style="margin-top:10px"><span class="k">Điểm tốt:</span> ${L.q.good.map(i=>`${i.t} (${i.y})`).join('; ')}.</div>`;
    if(L.q.bad.length) h+=`<div class="p"><span class="k" style="color:var(--bad)">Điểm khuyết:</span> ${L.q.bad.map(i=>`${i.t}${i.y?` (${i.y})`:''}`).join('; ')}.</div>`;
    if(L.h==='tho'&&L.q.parts){ const pp=L.q.parts; const nm={mui:'Mũi',tran:'Trán',gm:'Gò má',cam:'Cằm'}; h+=`<div class="p mini">${Object.keys(pp).filter(k=>pp[k].score!=null).map(k=>`${nm[k]}: <b style="color:${BANDCOL[pp[k].band]}">${BANDTXT[pp[k].band]}</b>`).join(' · ')}</div>`; }
    if(key!=='honnhan') h+=`<div class="quote">${LTV[rel][L.band]}</div>`;
  }
  const X=[];
  if(key==='congviec'){
    if(R.gt==='nu'&&L.band!=='na') h+=spouseTxt('quan',R);
    X.push(`Môi trường hợp tướng ${HANH[T]}: ${lc(TUONG[T].mt)}`);
    if(d.gm) X.push(`Gò má (tính cạnh tranh, lãnh đạo): ${lc(optMeaning('gm',d.gm)||optLabel('gm',d.gm))}`);
    if(is(d,'phap_lenh','vuot')) X.push('Pháp lệnh vượt mép: lời nói có quyền lực — tiềm năng lãnh đạo.');
    if(is(d,'phap_lenh','nhap')) X.push('Pháp lệnh nhập khẩu: lời nói dễ gây họa trong công việc — cẩn trọng khi phát ngôn.');
    if(d.cam_hinh) X.push(`Cằm (theo đuổi mục tiêu): ${lc(optMeaning('cam_hinh',d.cam_hinh)||'vừa phải')}`);
    if(is(d,'co','dai')) X.push('Cổ dài: hợp vai quân sư, hoạch định — tầm nhìn xa, hành động chậm.');
    if(is(d,'co','ngan')) X.push('Cổ ngắn: hợp đội hành động, thực thi nhanh.');
    if(R.gt==='nam'&&has(d,'mui_db','gay')) X.push('Mũi gãy (nam): niềm tin, cái tôi trong quan hệ công việc, sự nghiệp dễ bị sụp đổ.');
    if(R.khoHopTac.length>=2) X.push(`Khó hợp tác làm ăn: ${joinVi(R.khoHopTac)} — nên làm chủ một mảng riêng hơn là chia quyền.`);
    if(R.tai.n>=5) X.push(`Tướng tài (${R.tai.n}/7 tiêu chí): có năng lực hiệu triệu, vận dụng nguồn lực, cụ thể hóa vấn đề trừu tượng.`);
    R.nhom.forEach(n=>X.push(`${n.t}: ${n.y.split('.')[0]}.`));
  }
  if(key==='tienbac'){
    if(R.gt==='nam'&&L.band!=='na') h+=spouseTxt('tai',R);
    if(is(d,'mui_lo','to')) X.push('Lỗ mũi to, lộ: dễ chi tiêu hoang phí, hao tài — cần một "két khóa" tự động cho khoản tích lũy.');

    if(R.vayMuon) X.push('Tướng Mộc kèm răng thưa / cười hở lợi / mắt to: dễ vướng chuyện vay – mượn tiền bạc; nên rạch ròi tiền nong, có giấy tờ.');
    if(R.nhom.some(n=>n.k==='thoaman')) X.push('Thuộc nhóm Thỏa mãn, nhiều dục vọng: chi tiêu theo ham muốn — đặt ngân sách trước khi tiêu.');
    if(is(d,'tai_dai','to')) X.push('Dái tai to: dễ hài lòng — tiền đủ dùng là yên, ít khi liều lĩnh.');
  }
  if(key==='honnhan'){
    if(L.band!=='na'){ h+=spouseTxt(rel,R); }
    if(d.rang_duoi) X.push(is(d,'rang_duoi','deu')?'Răng dưới đều khít: thâm giao không huyết thống (hôn nhân) gắn bó.':'Răng dưới thưa lệch: hôn nhân dễ có khoảng cách — cần vun đắp chủ động.');

    if(R.gt==='nu'&&is(d,'moi_duoi','to')) X.push('Môi dưới to, mọng: sinh nở dễ, tử cung tốt.');
    if(is(d,'moi_mau','hong')) X.push('Môi đỏ hồng: dễ có quan hệ tốt, giao tiếp hòa thuận.');
    if(R.hoaDuc) X.push('Tướng Hỏa gò má nhiều thịt, căng bóng: dục tính cao, cảm xúc thất thường — chữ tín trong tình cảm cần giữ.');
  }
  if(key==='chame'){
    if(d.rang_tren) X.push(is(d,'rang_tren','deu')?'Răng trên đều khít: thâm giao huyết thống bền — giáo dục gia đình có nền.':'Răng trên thưa lệch: thâm giao huyết thống có khe hở.');
    if(is(d,'nhan_trung','nong')) X.push('Nhân trung nông, ngắn: thiếu sự yêu thương từ gia đình.');
    if((is(d,'mui_cao','thap'))&&is(d,'mui_soncan','cao')) X.push('Mũi nhỏ mà sơn căn cao: sức khỏe cha/mẹ dễ có vấn đề, nhưng bản thân sinh lực cao.');
    if(R.ht.rel==='hinhsinh') X.push('Hình sinh thần: dễ được lợi từ môi trường, gặp quý nhân.');
    if(R.phuc.loai==='tienthien') X.push('Phúc tiên thiên dày: xuất phát điểm tốt về thân – tâm – trí.');
    if(R.phuc.loai==='batuc') X.push('Tiên thiên bất túc: ít dựa được vào gốc — phải tự gây dựng.');
  }
  if(key==='concai'){
    if(R.gt==='nu'&&d.moi_duoi) X.push(is(d,'moi_duoi','to')?'Môi dưới to, mọng: sinh nở dễ, tử cung tốt.':'Môi dưới không mọng: chú ý chăm sóc sức khỏe sinh sản.');
    if(is(d,'phap_lenh','vuot')) X.push('Pháp lệnh rõ: lời nói có trọng lượng với cấp dưới — dẫn dắt được người.');
    if(is(d,'phap_lenh','nhap')) X.push('Pháp lệnh nhập khẩu: lời nói với người dưới dễ gây tổn thương — nói ít, làm gương nhiều.');
    if(is(d,'moi_tren','day')) X.push('Môi trên dày: chân thành — cấp dưới dễ tin.');
    if(is(d,'moi_tren','mong')) X.push('Môi trên mỏng: khen chê không thật — cấp dưới khó biết mình đứng ở đâu.');
  }
  if(key==='anhem'){
    if(d.rang_tren) X.push(is(d,'rang_tren','deu')?'Răng trên đều khít: tình huyết thống bền chặt.':'Răng trên thưa lệch: tình huyết thống có khoảng cách.');
    if(is(d,'moi_tren','day')) X.push('Môi trên dày: thật thà, đôn hậu trong quan hệ sơ giao — bạn bè quý.');
    if(is(d,'moi_tren','mong')) X.push('Môi trên mỏng: quan hệ sơ giao chưa thật lòng — bạn nhiều mà tri kỷ ít.');
    if(is(d,'mieng_cuoi','holoi')) X.push('Cười hở lợi: khó giữ bí mật — cẩn trọng khi được bạn bè tâm sự.');
    if(is(d,'lm_giao','co')) X.push('Mày giao nhau: xung đột lập trường — dễ va chạm với người gần.');
    if(R.nhom.some(n=>n.k==='ketnoi')) X.push('Thuộc nhóm Kết nối: bạn bè là nguồn năng lượng — có kết nối mới xóa được bất an.');
  }
  if(X.length) h+=`<div class="h3" style="font-size:15.5px;margin-top:14px">Các nét bổ trợ cho khía cạnh này</div><ul style="margin:0;padding-left:18px">${X.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  return h;
}

  R.conf.forEach(c=>{ sc[c.tag]=(sc[c.tag]||0)+c.w*0.8; (conf[c.tag]=conf[c.tag]||[]).push(c); });
  const ans=R.ans||{};
  for(const t in sc){ const a=ans['th_'+t]; if(a==='y') sc[t]*=1.4; else if(a==='n') sc[t]*=0.35; else if(a==='p') sc[t]*=0.9; }
  const list=Object.keys(sc).map(t=>({t,s:sc[t],ev:ev[t]||[],conf:conf[t]||[]})).filter(x=>x.s>=1.2).sort((a,b)=>b.s-a.s);
  return list;
}

function buildQuestions(R){

  const raw=computeThemes({...R,ans:{}});
  raw.slice(0,3).forEach(a=>Q.push({id:'th_'+a.t,q:THQ[a.t],type:'th',t:a.t}));
  const weak=LT_ORDER.map(k=>({k,...R.lt[k]})).filter(x=>x.band==='suy').sort((a,b)=>a.score-b.score)[0];
  if(weak&&Q.length<5) Q.push({id:'lt_'+weak.k,q:`Có phải ${lc(weak.y.split('·')[0].split(',')[0]).trim()} là mảng đời bạn thấy nhiều trắc trở nhất?`,type:'lt',k:weak.k});

}

function leadFromAnswers(R){
  const A=R.ans||{}; if(!Object.keys(A).length) return '';

  const ty=yes.filter(q=>q.type==='th').map(q=>THEMES[q.t].ten.toLowerCase()), tn=no.filter(q=>q.type==='th').map(q=>THEMES[q.t].ten.toLowerCase());

function roleHTML(h,q,R){

function vanTrinh(R){
  const d=R.d, Q=R.Q, tq=Q.tho.parts;
  const avg=a=>{const v=a.filter(x=>x!=null);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};
  const adj={troi:12,can:0,kem:-12};
  const mk3=(key,ten,vung,base)=>{ let s=base; const lvl=d['td_'+key]; if(lvl&&s==null) s=50; if(s!=null&&lvl) s+=adj[lvl]; s=s==null?null:clamp(rnd(s),5,97); const cam=R.cam.dinh.includes(key); return {key,ten,vung,s,b:band(s),cam,lvl}; };
  return [
    mk3('thuong','Tiền vận','Thượng đình · trán',tq.tran.score),
    mk3('trung','Trung vận','Trung đình · mắt, mũi, gò má',avg([Q.hoa.score,tq.mui.score,tq.gm.score])),
    mk3('ha','Hậu vận','Hạ đình · miệng, cằm',avg([Q.kim.score,tq.cam.score]))
  ];
}

function skCatmull(pts,k){

    s+=`C${n1(c1[0])} ${n1(c1[1])} ${n1(c2[0])} ${n1(c2[1])} ${n1(p2[0])} ${n1(p2[1])}`;
  }
  return s+'Z';
}

/* ---------- chân dung chữ ---------- */
function vanTrend(V){
  const s=V.map(v=>v.s); if(s.some(x=>x==null)) return '';
  if(s[0]<s[1]&&s[1]<s[2]) return 'dòng vận đi lên: tiền khó, hậu thuận';
  if(s[0]>s[1]&&s[1]>s[2]) return 'dòng vận đi xuống: tiền thuận, hậu cần giữ';
  if(s[1]>=s[0]&&s[1]>=s[2]) return 'trung vận là đỉnh';
  if(s[1]<=s[0]&&s[1]<=s[2]) return 'trung vận là đáy, vượt qua thì hậu vận mở';
  return '';
}
function portraitHTML(R){
  const T=R.T,t=TUONG[T],d=R.d;
  const all=[...R.Q.hoa.items,...R.Q.thuy.items,...R.Q.kim.items,...R.Q.moc.items,...R.Q.tho.items];
  const seen=new Set(); const uniq=all.filter(i=>{const key=i.t.replace(/ \(.*\)$/,''); if(seen.has(key)) return false; seen.add(key); return true});
  const pos=uniq.filter(i=>i.s>=0.5&&i.y).sort((a,b)=>b.s-a.s).slice(0,3);
  const neg=uniq.filter(i=>i.s<=-0.5).sort((a,b)=>a.s-b.s).slice(0,3);
  const tq=[]; Object.keys(ORGAN_KEYS).forEach(g=>thaiQua(d,g).forEach(x=>tq.push(x)));
  const chips=[];
  chips.push(`<span class="pchip" style="--c:${HCOLOR[T]}"><i></i>Tướng ${HANH[T]} · chữ ${t.duc}</span>`);
  if(R.second&&R.secondPct>=55&&T!=='thuy') chips.push(`<span class="pchip" style="--c:${HCOLOR[R.second]}"><i></i>Phụ ${HANH[R.second]} ${R.secondPct}%</span>`);
  if(R.ht.has) chips.push(`<span class="pchip" style="--c:${HCOLOR[R.ht.tH]}"><i></i>Thần ${R.ht.than.ten}</span>`);
  const pl={tienthien:'Phúc tiên thiên dày',trung:'Phúc ở mức trung',batuc:'Tiên thiên bất túc',na:''}[R.phuc.loai]; if(pl) chips.push(`<span class="pchip"><i></i>${pl}</span>`);
  if(R.nghiLuc!=null) chips.push(`<span class="pchip" style="--c:${BANDCOL[band(R.nghiLuc)]}"><i></i>Nghị lực ${BANDTXT[band(R.nghiLuc)].toLowerCase()}</span>`);
  const li=(a,cls)=>a.map(i=>`<li class="${cls}"><span class="m">${cls==='g'?'✓':'!'}</span><span><b>${i.t.replace(/ \(.*\)$/,'')}</b>${i.y?` — ${i.y}`:''}</span></li>`).join('');
  let h=`<div class="pchips">${chips.join('')}</div>`;
  if(pos.length||neg.length) h+=`<div class="pcols"><div><div class="plb">Điểm sáng</div><ul>${pos.length?li(pos,'g'):'<li class="n">Chưa đủ nét để chỉ ra điểm sáng.</li>'}</ul></div><div><div class="plb">Điểm cần giữ</div><ul>${neg.length?li(neg,'b'):'<li class="n">Chưa thấy nét khuyết rõ.</li>'}</ul>${tq.length?`<div class="mini2" style="margin-top:6px"><b style="color:var(--bad)">Thái quá:</b> ${tq.map(x=>x.replace(/<[^>]+>/g,'').replace(/\. Tướng đẹp.*$/,'')).slice(0,2).join(' · ')}</div>`:''}</div></div>`;
  /* tóm lại */
  const vt=vanTrend(R.van);
  let s=`Đây là gương mặt <b>${HANH[T]}</b> — ${lc(t.core)}.`;
  if(pos.length) s+=` Mạnh ở ${joinVi(pos.slice(0,2).map(i=>lc(i.y)))}.`;
  if(neg.length) s+=` Cần giữ ${joinVi(neg.slice(0,2).map(i=>lc(i.y||i.t.replace(/ \(.*\)$/,''))))}.`;
  if(R.themes.length) s+=` Sợi chỉ đỏ của khuôn mặt: <b>${lc(THEMES[R.themes[0].t].ten)}</b>.`;
  if(vt) s+=` Về vận trình, ${vt}.`;
  h+=`<div class="psum">${s}</div>`;
  return h;
}

/* ---- radar ---- */
function radar(labels,vals,colors,main){
  const W=220,cx=110,cy=112,r=74,n=labels.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*r*v/100,cy+Math.sin(a)*r*v/100]};
  let g='';
  [25,50,75,100].forEach(l=>{g+=`<polygon points="${labels.map((_,i)=>pt(i,l).join(',')).join(' ')}" fill="none" stroke="#e4d6bd" stroke-width="1"/>`});
  labels.forEach((_,i)=>{const p=pt(i,100);g+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#e4d6bd"/>`});
  const poly=vals.map((v,i)=>pt(i,Math.max(v??0,4)).join(',')).join(' ');
  g+=`<polygon points="${poly}" fill="${main}33" stroke="${main}" stroke-width="2" stroke-linejoin="round"/>`;
  vals.forEach((v,i)=>{const p=pt(i,Math.max(v??0,4));g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${colors[i]}"/>`});
  labels.forEach((l,i)=>{const p=pt(i,128);g+=`<text x="${p[0]}" y="${p[1]+4}" text-anchor="middle" font-size="11.5" font-weight="700" fill="${colors[i]}" font-family="Be Vietnam Pro,sans-serif">${l}</text><text x="${p[0]}" y="${p[1]+17}" text-anchor="middle" font-size="10" fill="#8a7660" font-family="Be Vietnam Pro,sans-serif">${vals[i]??'–'}</text>`});
  return `<svg viewBox="0 0 ${W} 236" role="img">${g}</svg>`;
}

  h+=`<div class="res-actions"><button class="btn btn-light" id="r-copy">⧉ Sao chép bài luận</button><button class="btn btn-light" id="r-save">✚ Lưu hồ sơ</button><button class="btn btn-light" id="r-open">⊕ Mở tất cả mục</button><button class="btn btn-light" id="r-new">↺ Người mới</button></div>`;
  $('#scr-result').innerHTML=h;
  $('#scr-input').classList.add('hide'); $('#scr-result').classList.remove('hide');
  const CN=[['sketch','Phác thảo'],['chandung','Chân dung'],['tong','Tổng luận'],['mauthuan','Trục chính'],['hoilai','Thầy hỏi'],['lucthan','Lục thân'],['khiacanh','Khía cạnh'],['tamdinh','Vận trình'],['nguquan','Ngũ quan']];
  const cn=$('#chipnav'); cn.classList.remove('hide'); cn.innerHTML=CN.map(([id,l])=>`<a href="#sec-${id}" data-go="${id}">${l}</a>`).join('');
  cn.querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();const el=$('#sec-'+a.dataset.go); if(!el) return; if(el.classList.contains('acc')) el.classList.add('open'); const y=el.getBoundingClientRect().top+scrollY-108; scrollTo({top:y,behavior:'smooth'}); cn.querySelectorAll('a').forEach(x=>x.classList.toggle('on',x===a));});
  $('#nav-in').innerHTML=`<button class="btn btn-ghost" id="b-edit">‹ Sửa đặc điểm</button><button class="btn btn-gold" id="b-save2">Lưu hồ sơ</button>`;
  $('#b-edit').onclick=()=>showInput(); $('#b-save2').onclick=saveRecord;
  document.querySelectorAll('#scr-result .acc-h').forEach(x=>x.onclick=()=>x.parentElement.classList.toggle('open'));
  document.querySelectorAll('[data-ov]').forEach(b=>b.onclick=()=>{S.override=b.dataset.ov===R.inf.main?null:b.dataset.ov;renderResult();toast('Đã luận lại theo tướng '+HANH[b.dataset.ov])});
  document.querySelectorAll('[data-asp]').forEach(b=>b.onclick=()=>{UI.aspect=b.dataset.asp;document.querySelectorAll('[data-asp]').forEach(x=>x.classList.toggle('on',x===b));$('#asp-body').innerHTML=aspectHTML(UI.aspect,UI.R)});
  $('#r-copy').onclick=copyText; $('#r-save').onclick=saveRecord; $('#r-new').onclick=()=>{S={info:{ten:'',gt:'',tuoi:''},d:{},img:null,override:null,ans:{}};saveDraft();updateDock();UI.step=0;showInput()};
  $('#r-open').onclick=()=>document.querySelectorAll('#scr-result .acc').forEach(a=>a.classList.add('open'));
  document.querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>{const id=b.dataset.ans,v=b.dataset.v;if(S.ans[id]===v)delete S.ans[id];else S.ans[id]=v;saveDraft();renderResult(true);});
  if(keep){document.querySelectorAll('#scr-result .acc').forEach(a=>a.classList.toggle('open',openIds.includes(a.id)));scrollTo(0,sy);} else scrollTo(0,0);
}

function copyText(){
  const box=$('#scr-result').cloneNode(true);
  box.querySelectorAll('.acc').forEach(a=>a.classList.add('open'));
  box.querySelectorAll('.res-actions,.ovr,.asp,svg').forEach(x=>x.remove());
  const tmp=document.createElement('div');tmp.style.cssText='position:fixed;left:-9999px;top:0;width:500px';tmp.appendChild(box);document.body.appendChild(tmp);
  const txt='DIỆN TƯỚNG HỌC — TIEN.TQN\n\n'+box.innerText.replace(/\n{3,}/g,'\n\n').replace(/[▾]/g,'').trim();
  document.body.removeChild(tmp);
  const done=()=>toast('Đã sao chép bài luận');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,()=>fallback(txt,done)); else fallback(txt,done);
}
function fallback(txt,done){const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('Không sao chép được')}document.body.removeChild(ta)}

/* ---- records ---- */
function saveRecord(){
  const R=UI.R; if(!R) return;
  const list=store.get(LS_REC,[]);
  const rec={id:Date.now(),info:{...S.info},d:JSON.parse(JSON.stringify(S.d)),ans:{...S.ans},override:S.override,T:R.T,time:new Date().toLocaleString('vi-VN')};
  const i=list.findIndex(x=>x.info.ten&&x.info.ten===rec.info.ten&&x.info.gt===rec.info.gt);
  if(i>=0) list[i]=rec; else list.unshift(rec);
  toast(store.set(LS_REC,list.slice(0,60))?'Đã lưu hồ sơ':'Trình duyệt không cho lưu');
}
$('#btn-records').onclick=()=>{
  const list=store.get(LS_REC,[]);
  let h=`<div class="h2" style="font-size:20px">Hồ sơ đã lưu</div><p class="sub">${list.length} người · lưu trên máy này</p><hr class="rule">`;
  h+=list.length?list.map(r=>`<div class="rec"><div class="dot" style="background:${HCOLOR[r.T]}">${HANH[r.T][0]}</div><div class="bd"><b>${esc(r.info.ten)||'Không tên'}</b><span>${r.info.gt==='nam'?'Nam':'Nữ'}${r.info.tuoi?' · '+esc(r.info.tuoi)+' tuổi':''} · ${HANH[r.T]} · ${r.time}</span></div><button class="btn btn-light" style="padding:7px 11px;font-size:13px" data-load="${r.id}">Mở</button><button class="btn btn-light" style="padding:7px 10px;font-size:13px;color:var(--bad)" data-del="${r.id}">✕</button></div>`).join(''):'<p class="mini">Chưa có hồ sơ nào. Sau khi luận giải, bấm "Lưu hồ sơ".</p>';
  openSheet(h);
  document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{const r=list.find(x=>x.id==b.dataset.load);S={info:{...r.info},d:r.d,img:null,override:r.override||null,ans:r.ans||{}};saveDraft();updateDock();$('#sheet').classList.remove('show');renderResult()});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!confirm('Xóa hồ sơ này?'))return;store.set(LS_REC,list.filter(x=>x.id!=b.dataset.del));$('#btn-records').onclick()});
};

/* init */
updateDock(); renderInput();
</script>
